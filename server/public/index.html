<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RzCore · PC-Checker</title><link rel="icon" href="/logo.png">
<style>

body{background:linear-gradient(#ff46580a 1px,transparent 1px) 0 0/100% 44px,linear-gradient(90deg,#ff46580a 1px,transparent 1px) 0 0/44px 100%,radial-gradient(ellipse 70% 50% at 50% 0,#3d0b13,transparent 70%),var(--bg)!important}

  function s3(pin,pr){if(!ui){const t0=Date.now(),pc=$('b',{class:'big'},'0%'),stt=$('div',{class:'mu'},''),bar=$('i'),clk=$('span',{class:'mono'},'00:00');
    ui={pc,stt,bar,t0,clk};setInterval(()=>{const s=Math.floor((Date.now()-t0)/1e3);clk.textContent=String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')},1000);
    show([steps(2),$('div',{class:'panel',style:'max-width:640px;margin:0 auto'},$('div',{class:'sub'},$('span',{class:'mono'},'Session '+pin),clk),wheel('wheel ring'),$('div',{class:'center'},pc,stt),$('div',{class:'bar'},bar))])}
   ui.pc.textContent=Math.round(pr.pct)+'%';ui.stt.textContent=pr.status;ui.bar.style.width=pr.pct+'%'}
  function s4(pin){ui=null;show([steps(4),$('div',{class:'panel center',style:'max-width:520px;margin:0 auto'},$('div',{class:'big',style:'color:var(--ok)'},'✓'),$('h3',{style:'margin:6px 0'},'Scan complete'),$('p',{class:'mu'},'Session '+pin+' has been received.'),$('div',{class:'row'},$('button',{class:'btn',onclick:()=>go('reports',pin)},'View report'),$('button',{class:'btn alt',onclick:()=>go('new')},'New scan')))])}
  s1();return box}
 render();return $('div',{class:'shell'},side,main)}
