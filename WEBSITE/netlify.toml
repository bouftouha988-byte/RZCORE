[build]
  publish = "."
  functions = "netlify/functions"

[[redirects]]
  from = "/auth/discord"
  to = "/.netlify/functions/auth"
  status = 200

[[redirects]]
  from = "/auth/discord/callback"
  to = "/.netlify/functions/callback"
  status = 200

[[redirects]]
  from = "/api/me"
  to = "/.netlify/functions/me"
  status = 200

[[redirects]]
  from = "/logout"
  to = "/.netlify/functions/logout"
  status = 200