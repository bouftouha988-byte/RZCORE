/* ===== RzCore-red theme overrides ===== */
:root{--bg:#000;--s1:rgba(255,255,255,.02);--s2:rgba(255,255,255,.035);--s3:rgba(255,255,255,.06);--line:rgba(255,255,255,.08);--line2:rgba(255,255,255,.15);--red:#f52b35;--red2:#ff736b;--tx:#fafafa;--mu:rgba(255,255,255,.56);--mu2:rgba(255,255,255,.34);--ok:#3ddc97}
